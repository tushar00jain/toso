[package]
name = "toso-tui"
version = "0.1.0"
edition = "2021"
description = "A ratatui terminal UI for inspecting a TorchStore"

[[bin]]
name = "toso-tui"
path = "src/main.rs"

[[bin]]
name = "agg_stub"
path = "src/bin/agg_stub.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
color-eyre = "0.6"
async-trait = "0.1"
